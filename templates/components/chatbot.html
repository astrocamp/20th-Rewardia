<!-- AI 聊天機器人組件 -->
<div
  x-data="chatbot()"
  x-init="username = '{% if user.is_authenticated %}{{ user.first_name|default:user.username }}{% else %}使用者{% endif %}'"
  @mousemove.window="handleDrag($event); handleResize($event)"
  @mouseup.window="stopDrag(); stopResize()"
  x-cloak
>
  <!-- 浮動按鈕 -->
  <button
    @click="toggleChat()"
    class="chatbot-float-btn"
    :class="{ 'opacity-0 pointer-events-none': isOpen }"
    aria-label="開啟 AI 助理"
    type="button"
  >
    <!-- AI 機器人圖標 -->
    <img class="w-8 h-8" src="https://rewardia-web-pic.s3.ap-southeast-2.amazonaws.com/web-pic/Rewardia_nobg.ico" alt="Rewardia Logo">
  </button>

  <!-- 聊天視窗 -->
  <div
    class="chatbot-window"
    :class="{ 'show': isOpen, 'dragging': isDragging, 'resizing': isResizing }"
    :style="windowStyle"
    x-show="isOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform translate-y-full scale-75"
    x-transition:enter-end="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 transform translate-y-full scale-75"
  >
    <!-- 標題列（可拖拽） -->
    <div class="chatbot-header" @mousedown="startDrag($event)">
      <h3 class="chatbot-title">Rewardia 助理</h3>
      <button
        @click="closeChat()"
        @mousedown.stop
        class="chatbot-close-btn"
        aria-label="關閉聊天視窗"
        type="button"
      >
        {% include 'components/icon.html' with name="close" size="w-5 h-5" %}
      </button>
    </div>

    <!-- 訊息區域 -->
    <div class="chatbot-messages" x-ref="messagesContainer">
      <!-- 空狀態 -->
      <div x-show="messages.length === 0" class="chatbot-empty-state">
        {% if user.is_authenticated %}
          <p class="text-lg font-bold">Hi, {{ user.first_name|default:user.username }}</p>
        {% else %}
          <p class="text-lg">你好</p>
        {% endif %}
        <p class="text-lg">歡迎來到 Rewardia ，</p>
        <p class="text-lg">我會好好帶你認識它。</p>
         <p class="text-lg">你也能輸入"優惠試算"或"註冊"或"首頁"，我就會帶你過去喔 ❤️</p>
        
      </div>

      <!-- 訊息列表 -->
      <template x-for="(message, index) in messages" :key="index">
        <div class="w-full mb-2">
          <!-- 用戶訊息 -->
          <div x-show="message.type === 'user'" class="flex justify-end mb-2">
            <div class="rounded-2xl px-3.5 py-2.5 max-w-[80%] bg-gradient-to-br from-indigo-500 to-violet-500 text-white shadow-md leading-relaxed whitespace-pre-wrap break-words" x-text="message.content"></div>
          </div>
          
          <!-- AI 訊息 -->
          <div x-show="message.type === 'ai'" class="flex justify-start mb-2">
            <div class="rounded-2xl px-3.5 py-2.5 max-w-[80%] bg-white/80 backdrop-blur shadow-sm ring-1 ring-slate-200 text-slate-800 leading-relaxed whitespace-pre-wrap break-words" x-text="message.content"></div>
          </div>
        </div>
      </template>

      <!-- 載入指示器 -->
      <div x-show="isLoading" class="flex justify-start mb-2">
        <div class="rounded-2xl px-3.5 py-2.5 max-w-[80%] bg-white/80 backdrop-blur shadow-sm ring-1 ring-slate-200 text-slate-800 leading-relaxed">
          <div class="chatbot-loading">
            <span>正在思考</span>
            <div class="chatbot-typing-dots">
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 輸入區域 -->
    <div class="chatbot-input-area">
      <textarea
        x-model="currentMessage"
        :disabled="isLoading"
        placeholder="輸入訊息（Shift+Enter 換行）"
        class="textarea textarea-bordered w-full rounded-2xl resize-none focus:outline-none focus:ring-2 focus:ring-violet-400/70 min-h-10 max-h-20 py-2 px-3 text-sm"
        maxlength="500"
        autocomplete="off"
        x-ref="messageInput"
        rows="1"
        @input="autoResize($event)"
        @keydown="handleKeyDown($event)"
        @compositionstart="handleCompositionStart($event)"
        @compositionend="handleCompositionEnd($event)"
      ></textarea>

      <!-- 錯誤訊息 -->
      <div x-show="errorMessage" x-transition class="mt-2">
        <p class="text-red-500 text-xs" x-text="errorMessage"></p>
      </div>
    </div>

    <!-- 調整大小控制 -->
    <div
      class="chatbot-resize-handle"
      @mousedown="startResize($event)"
      aria-label="調整視窗大小"
    >
      {% include 'components/icon.html' with name="resize" size="w-3 h-3" %}
    </div>
  </div>
</div>
