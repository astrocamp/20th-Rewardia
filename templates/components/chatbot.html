<!-- AI 聊天機器人組件 -->
<div 
  x-data="chatbot()" 
  x-init="username = '{% if user.is_authenticated %}{{ user.first_name|default:user.username }}{% else %}使用者{% endif %}'" 
  @mousemove.window="handleDrag($event); handleResize($event)"
  @mouseup.window="stopDrag(); stopResize()"
  x-cloak
>
  <!-- 浮動按鈕 -->
  <button
    @click="toggleChat()"
    class="chatbot-float-btn"
    :class="{ 'opacity-0 pointer-events-none': isOpen }"
    aria-label="開啟 AI 助理"
    type="button"
  >
    <!-- AI 機器人圖標 -->
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V7H21M7 10C5.89 10 5 10.89 5 12V22C5 23.11 5.89 24 7 24H17C18.11 24 19 23.11 19 22V12C19 10.89 18.11 10 17 10H7ZM7.5 12H9.5V14H7.5V12ZM14.5 12H16.5V14H14.5V12ZM7.5 15H16.5V16H7.5V15ZM12 17.5C10.07 17.5 8.5 16.43 8.5 15H15.5C15.5 16.43 13.93 17.5 12 17.5Z"/>
    </svg>
  </button>

  <!-- 聊天視窗 -->
  <div
    class="chatbot-window"
    :class="{ 'show': isOpen, 'dragging': isDragging, 'resizing': isResizing }"
    :style="windowStyle"
    x-show="isOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform translate-y-full scale-75"
    x-transition:enter-end="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 transform translate-y-full scale-75"
  >
    <!-- 標題列（可拖拽） -->
    <div class="chatbot-header" @mousedown="startDrag($event)">
      <h3 class="chatbot-title">Rewardia 助理</h3>
      <button 
        @click="closeChat()" 
        @mousedown.stop
        class="chatbot-close-btn"
        aria-label="關閉聊天視窗"
        type="button"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- 訊息區域 -->
    <div class="chatbot-messages" x-ref="messagesContainer">
      <!-- 空狀態 -->
      <div x-show="messages.length === 0" class="chatbot-empty-state">
        {% if user.is_authenticated %}
          <p class="text-lg font-medium">Hi, {{ user.first_name|default:user.username }}！</p>
        {% else %}
          <p class="text-lg">你好</p>
        {% endif %}
        <p class="text-lg">歡迎來Rewardia</p>
        <p class="text-lg">我來帶你認識這世界</p>
      </div>

      <!-- 訊息列表 -->
      <template x-for="(message, index) in messages" :key="index">
        <div class="w-full mb-4">
          <!-- 發送者標籤 -->
          <div
            :class="message.type === 'user' ? 'text-right mr-4 mb-1' : 'text-left ml-4 mb-1'"
          >
            <span
              class="text-xs text-gray-500"
              x-text="message.type === 'user' ? username : 'Rewardia'"
            ></span>
          </div>
          <!-- 訊息氣泡 -->
          <div
            class="message-bubble whitespace-pre-wrap"
            :class="message.type === 'user' ? 'message-user' : 'message-ai'"
            x-text="message.content"
          ></div>
        </div>
      </template>

      <!-- 載入指示器 -->
      <div x-show="isLoading" class="flex justify-start">
        <div class="message-bubble message-ai">
          <div class="chatbot-loading">
            <span>正在思考</span>
            <div class="chatbot-typing-dots">
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 輸入區域 -->
    <div class="chatbot-input-area">
      <textarea
        x-model="currentMessage"
        :disabled="isLoading"
        placeholder="輸入問題並按 Enter 發送"
        class="chatbot-input"
        maxlength="500"
        autocomplete="off"
        x-ref="messageInput"
        rows="1"
        @input="autoResize($event)"
        @keydown="handleKeyDown($event)"
        @compositionstart="handleCompositionStart($event)"
        @compositionend="handleCompositionEnd($event)"
      ></textarea>

      <!-- 錯誤訊息 -->
      <div x-show="errorMessage" x-transition class="mt-2">
        <p class="text-red-500 text-xs" x-text="errorMessage"></p>
      </div>
    </div>

    <!-- 調整大小控制 -->
    <div 
      class="chatbot-resize-handle"
      @mousedown="startResize($event)"
      aria-label="調整視窗大小"
    >
      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
        <path d="M22,22H20V20H22V22M22,18H20V16H22V18M18,22H16V20H18V22M18,18H16V16H18V18M14,22H12V20H14V22M22,14H20V12H22V14Z"/>
      </svg>
    </div>
  </div>
</div>
