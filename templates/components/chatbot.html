<!-- AI 聊天機器人組件 -->
<div x-data="chatbot" x-cloak>
  <!-- 浮動按鈕 -->
  <button 
    @click="toggleChat()" 
    class="chatbot-float-btn"
    :class="{ 'opacity-0 pointer-events-none': isOpen }"
    aria-label="開啟 AI 助理"
    type="button"
    style="position: fixed !important; bottom: 80px !important; right: 24px !important; left: auto !important; width: 56px !important; height: 56px !important; background-color: #2060B9 !important; color: white !important; border-radius: 50% !important; z-index: 9999 !important; display: flex !important; align-items: center !important; justify-content: center !important; box-shadow: 0 4px 12px rgba(32, 96, 185, 0.4) !important; transition: all 0.2s ease !important; border: none !important; cursor: pointer !important;"
  >
    <!-- 聊天圖標 -->
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
    </svg>
  </button>

  <!-- 聊天視窗 -->
  <div 
    class="chatbot-window"
    :class="{ 'show': isOpen }"
    x-show="isOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 transform translate-y-full scale-75"
    x-transition:enter-end="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 transform translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 transform translate-y-full scale-75"
    style="position: fixed !important; bottom: 50px !important; right: 24px !important; left: auto !important; width: 184px !important; height: 200px !important; background-color: white !important; border-radius: 8px !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important; z-index: 9998 !important; display: flex !important; flex-direction: column !important; overflow: hidden !important; border: 1px solid #e5e7eb !important;"
  >
    <!-- 標題列 -->
    <div class="chatbot-header">
      <div class="flex items-center gap-3">
        <!-- AI 圖標 -->
        <div class="w-8 h-8 bg-[#2060B9] rounded-full flex items-center justify-center">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.847a4.5 4.5 0 003.09 3.09L15.75 12l-2.847.813a4.5 4.5 0 00-3.09 3.091zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
          </svg>
        </div>
        <h3 class="chatbot-title">AI 助理</h3>
      </div>
      <button 
        @click="closeChat()" 
        class="chatbot-close-btn"
        aria-label="關閉聊天視窗"
        type="button"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- 訊息區域 -->
    <div class="chatbot-messages" x-ref="messagesContainer">
      <!-- 空狀態 -->
      <div x-show="messages.length === 0" class="chatbot-empty-state">
        <svg class="w-12 h-12 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
        <p class="text-sm">歡迎使用 AI 助理！</p>
        <p class="text-xs mt-1">有什麼問題都可以問我</p>
      </div>

      <!-- 訊息列表 -->
      <template x-for="(message, index) in messages" :key="index">
        <div class="flex" :class="message.type === 'user' ? 'justify-end' : 'justify-start'">
          <div 
            class="message-bubble"
            :class="message.type === 'user' ? 'message-user' : 'message-ai'"
            x-text="message.content"
          ></div>
        </div>
      </template>

      <!-- 載入指示器 -->
      <div x-show="isLoading" class="flex justify-start">
        <div class="message-bubble message-ai">
          <div class="chatbot-loading">
            <span>AI 正在思考</span>
            <div class="chatbot-typing-dots">
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
              <div class="chatbot-typing-dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 輸入區域 -->
    <div class="chatbot-input-area">
      <form @submit.prevent="sendMessage()" class="chatbot-input-form">
        <input 
          type="text"
          x-model="currentMessage"
          :disabled="isLoading"
          placeholder="輸入您的問題..."
          class="chatbot-input"
          maxlength="500"
          autocomplete="off"
          x-ref="messageInput"
        />
        <button 
          type="submit"
          :disabled="isLoading || !currentMessage.trim()"
          class="chatbot-send-btn"
          aria-label="發送訊息"
        >
          <!-- 發送圖標 -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </form>
      
      <!-- 錯誤訊息 -->
      <div x-show="errorMessage" x-transition class="mt-2">
        <p class="text-red-500 text-xs" x-text="errorMessage"></p>
      </div>
    </div>
  </div>

  <!-- 背景遮罩（手機版） -->
  <div 
    x-show="isOpen" 
    @click="closeChat()"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
  ></div>
</div>
