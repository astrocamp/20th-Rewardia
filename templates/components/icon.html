<!-- 統一圖示組件庫 -->
<!-- 
  支援的圖示：
  - eye: 眼睛圖示 (密碼可見)
  - eye-off: 眼睛圖示 (密碼隱藏)

  - google: Google圖示 (Google登入)

  - smart-recommend: 智慧推薦系統
  - real-time-offer: 即時優惠提醒
  - consumption-analysis: 消費分析報告
-->

{% if name == "eye" %}
  <!-- 眼睛圖示 - 密碼可見 -->
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.03613 12.322C1.96712 12.1146 1.96712 11.8904 2.03613 11.683C3.42313 7.51 7.36013 4.5 12.0001 4.5C16.6381 4.5 20.5731 7.507 21.9631 11.678C22.0331 11.885 22.0331 12.109 21.9631 12.317C20.5771 16.49 16.6401 19.5 12.0001 19.5C7.36213 19.5 3.42613 16.493 2.03613 12.322Z" stroke="#5D6970" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>

{% elif name == "google" %}

{% elif name == "smart-recommend" %}
  <!-- 智慧推薦系統 -->
  <svg class="icon {{ size|default:'w-6 h-6' }} {{ class|default:'' }}" 
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round" 
      stroke-linejoin="round">
      <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
  </svg>

{% elif name == "real-time-offer" %}
  <!-- 即時優惠提醒 -->
  <svg class="icon {{ size|default:'w-6 h-6' }} {{ class|default:'' }}" 
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round" 
      stroke-linejoin="round">
      <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>

{% elif name == "consumption-analysis" %}
  <!-- 消費分析報告 -->
  <svg class="icon {{ size|default:'w-6 h-6' }} {{ class|default:'' }}" 
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round" 
      stroke-linejoin="round">
      <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
  </svg>

{% else %}
  <!-- 預設圖示或錯誤提示 -->
  <div class="icon-placeholder {{ size|default:'w-6 h-6' }} {{ class|default:'' }} bg-gray-300 rounded flex items-center justify-center text-xs text-gray-600">
    {{ name|default:'icon' }}
  </div>
{% endif %}
