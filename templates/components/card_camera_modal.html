<!-- 攝影機模態框 -->
<div x-show="showCameraModal" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: rgba(0,0,0,0.8);"
     @keydown.escape="closeCamera()"
     x-cloak>
  
  <!-- 背景遮罩 -->
  <div class="card-camera-modal-backdrop"></div>
  
  <!-- 模態框內容 -->
  <div style="display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 1rem;">
    <div style="position: relative; background: white; border-radius: 0.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); width: auto; max-height: 80vh; overflow-y: visible;">
      
      <!-- 標題列 -->
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; border-bottom: 1px solid #e5e7eb;">
        <h3 style="font-size: 1.125rem; font-weight: 600; color: #111827; margin: 0;">信用卡卡號識別</h3>
        <button @click="closeCamera()" 
                style="color: #9ca3af; background: none; border: none; cursor: pointer; padding: 0.25rem;">
          <svg style="width: 1.5rem; height: 1.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <!-- 攝影機區域 -->
      <div style="padding: 1rem;">
        <div style="position: relative; background: #1f2937; border-radius: 0.5rem; overflow: hidden; width: fit-content; margin: 0 auto;">
          
          <!-- 攝影機預覽 -->
          <div style="position: relative; aspect-ratio: 1.55; background: black; width: 400px; height: 258px; overflow: hidden;">
            <video x-ref="video"
                   autoplay
                   muted
                   playsinline
                   webkit-playsinline
                   style="width: 100%; height: 100%; object-fit: cover;">
            </video>
            
            <!-- 取景框遮罩 -->
            <div x-ref="overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;">
              <!-- 上半部分遮罩 -->
              <div style="position: absolute; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); height: 50%;"></div>
              
              <!-- 下半部分遮罩 -->
              <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); height: 20%;"></div>
              
              <!-- 左側遮罩 -->
              <div style="position: absolute; left: 0; top: 65%; transform: translateY(-50%); background: rgba(0,0,0,0.5); width: 5%; height: 30%;"></div>
              
              <!-- 右側遮罩 -->
              <div style="position: absolute; right: 0; top: 65%; transform: translateY(-50%); background: rgba(0,0,0,0.5); width: 5%; height: 30%;"></div>
              
              <!-- 取景框邊框 -->
              <div x-ref="frame"
                   style="position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); border: 2px dashed white; width: 90%; height: 30%;">
              </div>
              
              <!-- 對齊指示器 -->
              <div style="position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center;">
                <div style="font-size: 0.875rem; margin-bottom: 0.5rem;">請將信用卡對準此框</div>
                <div style="font-size: 0.75rem; opacity: 0.75;">確保卡號清晰可見</div>
              </div>
            </div>
          </div>
          
          <!-- 隱藏的 canvas 用於拍照 -->
          <canvas x-ref="canvas" style="display: none;"></canvas>
        </div>
        
        <!-- 錯誤訊息 -->
        <div x-show="errorMessage" 
             x-transition
             style="margin-top: 1rem; padding: 1rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.5rem;">
          <div style="display: flex;">
            <svg style="width: 1.25rem; height: 1.25rem; color: #f87171; margin-right: 0.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p style="font-size: 0.875rem; color: #b91c1c; margin: 0;" x-text="errorMessage"></p>
          </div>
        </div>
        
        <!-- 控制按鈕 -->
        <div style="margin-top: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 1rem;">
          
          <!-- 拍照按鈕 -->
          <button @click="captureAndRecognize()"
                  :disabled="!isCameraOpen || isProcessing"
                  class="custom-capture-btn"
                  style="display: inline-flex; align-items: center; padding: 1rem 2.5rem; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; font-size: 1rem;"
                  :style="(!isCameraOpen || isProcessing) ? 'background: #9ca3af; cursor: not-allowed;' : 'background: #2563eb;'"
                  x-text="isProcessing ? '識別中...' : '拍照識別'">
          </button>
          
          <!-- 重新拍照按鈕 -->
          <button x-show="errorMessage && retryCount < maxRetries"
                  @click="retryCapture()"
                  style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; background: #d97706; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500;">
            <svg style="width: 1rem; height: 1rem; margin-right: 0.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            重新拍照
          </button>
          
          <!-- 手動輸入按鈕 -->
          <button x-show="errorMessage && retryCount >= maxRetries"
                  @click="openManualInput()"
                  style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; background: #6b7280; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500;">
            <svg style="width: 1rem; height: 1rem; margin-right: 0.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            手動輸入
          </button>
          
          <!-- 取消按鈕 -->
          <button @click="closeCamera()"
                  style="display: inline-flex; align-items: center; padding: 0.5rem 1rem; background: #6b7280; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500;">
            取消
          </button>
        </div>
        
        <!-- 使用說明 -->
        <div style="margin-top: 1rem; text-align: center; font-size: 0.875rem; color: #6b7280;">
          <p style="margin: 0;">請將信用卡對準取景框，確保卡號清晰可見後點擊拍照</p>
        </div>
      </div>
    </div>
  </div>
</div>
