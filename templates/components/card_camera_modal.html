<!-- Toast 訊息組件 -->
<div x-show="toast.show"
     x-transition:enter="transition-fade-in"
     x-transition:enter-start="opacity-0 transform translate-y-2"
     x-transition:enter-end="opacity-100 transform translate-y-0"
     x-transition:leave="transition-fade-out"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform translate-y-2"
     class="fixed top-4 right-4 z-[10000] px-4 py-3 rounded-lg shadow-lg text-white max-w-sm"
     :class="{
       'bg-green-500': toast.type === 'success',
       'bg-red-500': toast.type === 'error',
       'bg-blue-500': toast.type === 'info'
     }"
     x-text="toast.message">
</div>

<!-- 攝影機模態框 -->
<div x-show="showModal" 
     x-transition:enter="transition-fade-in"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-fade-out"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-[9999] bg-black/80"
     @keydown.escape="closeCamera()"
     x-cloak>
  
  <!-- 背景遮罩 -->
  <div class="card-camera-modal-backdrop"></div>
  
  <!-- 模態框內容 -->
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="relative bg-white rounded-lg shadow-2xl w-auto max-h-[80vh] overflow-y-visible">
      
      <!-- 標題列 -->
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900 m-0">信用卡卡號識別</h3>
        <button @click="closeCamera()" 
                class="text-gray-400 bg-none border-none cursor-pointer p-1 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <!-- 攝影機區域 -->
      <div class="p-4">
        <div class="relative bg-gray-800 rounded-lg overflow-hidden w-fit mx-auto">
          
          <!-- 攝影機預覽 -->
          <div class="relative aspect-[1.55] bg-black w-[400px] h-[258px] overflow-hidden">
            <video x-ref="video"
                   autoplay
                   muted
                   playsinline
                   webkit-playsinline
                   class="w-full h-full object-cover">
            </video>
            
            <!-- 取景框遮罩 -->
            <div x-ref="overlay" class="absolute inset-0 pointer-events-none">
              <!-- 上半部分遮罩 -->
              <div class="absolute top-0 left-0 right-0 bg-black/50 h-[55%]"></div>
              
              <!-- 下半部分遮罩 -->
              <div class="absolute bottom-0 left-0 right-0 bg-black/50 h-[25%]"></div>
              
              <!-- 左側遮罩 -->
              <div class="absolute left-0 top-[65%] -translate-y-1/2 bg-black/50 w-[5%] h-[20%]"></div>
              
              <!-- 右側遮罩 -->
              <div class="absolute right-0 top-[65%] -translate-y-1/2 bg-black/50 w-[5%] h-[20%]"></div>
              
              <!-- 取景框邊框 -->
              <div x-ref="frame"
                   class="absolute top-[65%] left-1/2 -translate-x-1/2 -translate-y-1/2 border-2 border-dashed border-white w-[90%] h-[20%]">
              </div>
              
              <!-- 對齊指示器 -->
              <div class="absolute top-[65%] left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-center">
                <div class="text-sm mb-2">請將信用卡對準此框</div>
                <div class="text-xs opacity-75">確保卡號清晰可見</div>
              </div>
            </div>
          </div>
          
          <!-- 隱藏的 canvas 用於拍照 -->
          <canvas x-ref="canvas" class="hidden"></canvas>
        </div>
        
        <!-- 錯誤訊息 -->
        <div x-show="error" 
             x-transition
             class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
          <div class="flex">
            <svg class="w-5 h-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-sm text-red-700 m-0" x-text="error"></p>
          </div>
        </div>
        
        <!-- 控制按鈕 -->
        <div class="mt-6 flex items-center justify-center gap-4">
          
          <!-- 拍照按鈕 -->
          <button @click="captureAndRecognize()"
                  :disabled="!cameraOpen || processing"
                  class="inline-flex items-center px-10 py-4 text-white border-none rounded-lg cursor-pointer font-medium text-base disabled:bg-gray-400 disabled:cursor-not-allowed"
                  :class="(!cameraOpen || processing) ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600'"
                  x-text="processing ? '識別中...' : '拍照識別'">
          </button>
          
          <!-- 重新拍照按鈕 -->
          <button x-show="error && retries < maxRetries"
                  @click="retryCapture()"
                  class="inline-flex items-center px-4 py-2 bg-orange-500 text-white border-none rounded-lg cursor-pointer font-medium">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            重新拍照
          </button>
          
          <!-- 手動輸入按鈕 -->
          <button x-show="error && retries >= maxRetries"
                  @click="openManualInput()"
                  class="inline-flex items-center px-4 py-2 bg-gray-500 text-white border-none rounded-lg cursor-pointer font-medium">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            手動輸入
          </button>
          
          <!-- 取消按鈕 -->
          <button @click="closeCamera()"
                  class="inline-flex items-center px-4 py-2 bg-gray-500 text-white border-none rounded-lg cursor-pointer font-medium">
            取消
          </button>
        </div>
        
        <!-- 使用說明 -->
        <div class="mt-4 text-center text-sm text-gray-500">
          <p class="m-0">請將信用卡對準取景框，確保卡號清晰可見後點擊拍照</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 卡號編輯模態框 -->
<div x-show="showEdit"
     x-transition:enter="transition-fade-in"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-fade-out"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-[9999] bg-black/80"
     @keydown.escape="cancelEdit()"
     x-cloak>
  
  <!-- 模態框內容 -->
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="relative bg-white rounded-lg shadow-2xl w-[500px] max-w-[90vw]">
      
      <!-- 標題列 -->
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900 m-0">請確認掃描後信用卡卡號</h3>
        <button @click="cancelEdit()" 
                class="text-gray-400 bg-none border-none cursor-pointer p-1 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <!-- 內容區域 -->
      <div class="p-6">
        
        <!-- 識別結果顯示 -->
        <div x-show="maskedNumber" class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            識別結果（遮蔽顯示）：
          </label>
          <div class="p-3 bg-gray-100 rounded font-mono text-base text-gray-500">
            <span x-text="formatCardNumber(maskedNumber)"></span>
          </div>
        </div>
        
        <!-- 可編輯輸入框 -->
        <div>
          <label for="cardNumberInput" class="block text-sm font-medium text-gray-700 mb-2">
            <span class="text-red-500">* </span>信用卡卡號：
          </label>
          <input type="text" 
                 id="cardNumberInput"
                 x-model="editNumber"
                 placeholder="可手動輸入或修改您的信用卡卡號"
                 maxlength="19"
                 class="w-full p-3 border border-gray-300 rounded text-base font-mono focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 @input="formatCardInput($event)"
                 @keydown.backspace="formatCardInput($event)"
                 @keydown.delete="formatCardInput($event)">
          <p class="text-xs text-gray-500 mt-1 mb-0">
            請輸入完整的16位卡號
          </p>
        </div>
        
        <!-- Luhn 驗證狀態 -->
        <div x-show="luhnValid !== null" class="mt-4">
          <div :class="luhnValid ? 'bg-green-50 border-green-200 text-green-800' : 'bg-yellow-50 border-yellow-200 text-yellow-800'"
               class="p-3 rounded border">
            <div class="flex items-center">
              <svg :class="luhnValid ? 'text-green-500' : 'text-yellow-500'" 
                   class="w-5 h-5 mr-2" 
                   fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      :d="luhnValid ? 'M5 13l4 4L19 7' : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'"></path>
              </svg>
              <span class="text-sm font-medium" 
                    x-text="luhnValid ? '卡號格式驗證通過' : '掃描的結果可能不正確，請您務必檢查'"></span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 按鈕區域 -->
      <div class="px-6 py-4 border-t border-gray-200 flex gap-3 justify-end">
        <button @click="cancelEdit()"
                class="inline-flex items-center px-4 py-2 bg-gray-500 text-white border-none rounded cursor-pointer font-medium">
          取消
        </button>
        <button @click="retryRecognition()"
                class="inline-flex items-center px-4 py-2 bg-green-500 text-white border-none rounded cursor-pointer font-medium">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          重新辨識
        </button>
        <button @click="confirmCardNumber()"
                :disabled="!editNumber || editNumber.replace(/\D/g, '').length < 12"
                class="inline-flex items-center px-4 py-2 text-white border-none rounded cursor-pointer font-medium disabled:bg-gray-400 disabled:cursor-not-allowed"
                :class="(!editNumber || editNumber.replace(/\D/g, '').length < 12) ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600'">
          確認使用
        </button>
      </div>
    </div>
  </div>
</div>
