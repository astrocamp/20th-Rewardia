{% extends 'layouts/default.html' %}

{% block title %}首頁 - Rewardia{% endblock %}

{% block content %}
<!-- 主要橫幅區域 (Banner) -->
<section class="relative mx-4 sm:mx-6 lg:mx-10 mb-4 sm:mb-6 lg:mb-8 banner-spacing overflow-hidden">
  <!-- 頁面標題 - 在 banner 圖上方 -->
  <div class="mb-4 sm:mb-6">
    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-black">首頁</h2>
  </div>
  
  <!-- Banner 圖區域 -->
  <div class="relative h-[300px] sm:h-[350px] lg:h-[400px] overflow-hidden rounded-lg">
    <!-- 背景圖片 -->
    <div class="absolute inset-0">
      <img src="https://github.com/astrocamp/20th-Rewardia/blob/pic/img/ChatGPT%20Image%202025%E5%B9%B48%E6%9C%8821%E6%97%A5%20%E4%B8%8A%E5%8D%8806_10_26.png?raw=true" 
        alt="Rewardia Banner Background" 
        loading="eager"
        class="w-full h-full object-cover object-[75%_9%]">
    </div>
    
    <!-- 內容區域 - 限制在左半邊 -->
    <div class="relative z-10 flex items-center h-full">
      <div class="text-white px-4 sm:px-8 lg:px-12 w-full lg:w-1/2">
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-bold mb-4 sm:mb-6 lg:mb-8 leading-tight tracking-wide">
          每次購物都能獲得現金回饋
        </h1>
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 lg:gap-6">
          <a href="#" id="member-join-btn" class="download-btn-primary download-btn-banner">
            立即比較，加入會員
          </a>
          <a href="#" id="chrome-download-btn" class="download-btn-secondary download-btn-banner">
            免費新增至 Chrome
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 卡片總覽區塊 -->
<section class="mx-4 sm:mx-6 lg:mx-10 my-8 sm:my-12 lg:my-16" x-data="main_search">
  <!-- 卡片總覽標題 -->
  <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-black mb-8 sm:mb-12 text-left font-kulim-park leading-tight-custom">
    卡片總覽
  </h2>
  
  <!-- 搜尋區域 -->
  <div class="mb-8">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="flex flex-col sm:flex-row">
        <!-- 選擇銀行 -->
        <div class="flex-1 border-b sm:border-b-0 sm:border-r border-gray-200">
          <select x-model="selectedBank" @change="onBankChange" class="horizontal-search-select" style="height: 80px; padding: 20px 100px; cursor: pointer;">
            <option value="">選擇銀行</option>
            <template x-for="bank in banks" :key="bank.code">
              <option :value="bank.name" x-text="bank.name"></option>
            </template>
          </select>
        </div>
        
        <!-- 選擇優惠類別 -->
        <div class="flex-1 border-b sm:border-b-0 sm:border-r border-gray-200">
          <select x-model="selectedReward" @change="onRewardChange" class="horizontal-search-select" style="height: 80px; padding: 20px 100px; cursor: pointer;">
            <option value="">選擇優惠類別</option>
            <template x-for="[code, display] in rewardCategoriesChoices" :key="code">
              <option :value="code" x-text="display"></option>
            </template>
          </select>
        </div>
        
        <!-- 搜尋輸入與按鈕 -->
        <div class="flex-1 flex">
          <input type="text" x-model="searchKeyword" @keydown.enter.prevent="performSearch" placeholder="請輸入關鍵字" class="horizontal-search-input" style="height: 80px; padding: 20px 16px;">
          <button @click="performSearch" class="horizontal-search-btn" style="height: 80px; width: 120px; cursor: pointer; background-color: #06b6d4;">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  
  <!-- 搜尋結果區域 -->
  <div class="grid gap-6" style="margin-top: 24px; max-height: 80vh; overflow-y: auto;" @scroll="handleScroll">
    <template x-for="card in displayCards" :key="card.id">
      <div class="card-result-item" style="display: flex !important; flex-direction: row !important; gap: 24px !important; padding: 24px !important; background: white !important; border: 1px solid #e5e7eb !important; border-radius: 8px !important;">
        <!-- 左側：信用卡名稱和圖片（垂直布局） -->
        <div style="display: flex !important; flex-direction: column !important; width: 50% !important;">
          <!-- 上方：卡片名稱和銀行 -->
          <div style="margin-bottom: 12px !important;">
            <h3 x-text="card.name" style="font-size: 32px !important; font-weight: 600 !important; color: #374151 !important; margin-bottom: 4px !important; line-height: 1.4 !important;"></h3>
            <p x-text="card.bank" style="font-size: 24px !important; color: #6b7280 !important;"></p>
          </div>
          <!-- 下方：信用卡圖片 -->
          <div style="height:240px !important; border-radius: 8px !important; overflow: hidden !important; display: flex !important; align-items: center !important; justify-content: center !important;">
            <img :src="card.image" :alt="card.name" style="max-width: 100% !important; max-height: 100% !important; object-fit: contain !important; border-radius: 8px !important;">
          </div>
        </div>
        
        <!-- 右側：優惠條件列表 -->
        <div style="width: 50% !important; display: flex !important; flex-direction: column !important; padding-top: 0 !important;">
          <template x-for="(reward, index) in card.rewards.slice(0, 4)" :key="index">
            <div>
              <!-- 項目名稱與數值 - 左右排列 -->
              <div style="display: flex !important; flex-direction: row !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; padding: 16px 0 !important;" :style="index === 0 && isMatchingReward(reward) ? 'background: #eff6ff !important; padding: 16px 12px !important; border-radius: 4px !important;' : ''">
                <div style="font-size: 16px !important; font-weight: 600 !important; color: #374151 !important; text-align: left !important; flex: 1 !important;" x-text="reward.category"></div>
                <div style="font-size: 18px !important; font-weight: bold !important; color: #1d4ed8 !important; text-align: right !important; flex-shrink: 0 !important;" x-text="reward.rate"></div>
              </div>
              <!-- 限制條件 -->
              <div style="font-size: 13px !important; color: #6b7280 !important; text-align: left !important; padding-bottom: 12px !important;" x-text="reward.limit" x-show="reward.limit"></div>
              <!-- 分隔線（除了最後一項） -->
              <div x-show="index < card.rewards.slice(0, 4).length - 1" style="height: 1px !important; background: #e5e7eb !important; margin: 8px 0 !important;"></div>
            </div>
          </template>
        </div>
      </div>
    </template>
    
    <!-- 載入更多指示器 -->
    <div x-show="hasMoreCards()" class="text-center py-6">
      <div x-show="!isLoadingMore" class="text-gray-500">
        向下滾動載入更多卡片...
      </div>
      <div x-show="isLoadingMore" class="flex justify-center items-center space-x-2">
        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500"></div>
        <span class="text-gray-500">載入中...</span>
      </div>
    </div>
    
    <!-- 沒有更多卡片時的提示 -->
    <div x-show="!hasMoreCards() && displayCards.length > 0" class="text-center py-6 text-gray-500">
      已顯示所有相關卡片
    </div>
  </div>
</section>

{% endblock %}
