{% extends 'admins/default.html' %} {%block content%}
<section
  class="relative mx-4 sm:mx-6 lg:mx-10 mb-4 sm:mb-6 lg:mb-8 banner-spacing overflow-hidden"
>
  <div class="my-4 sm:mb-6">
    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-black">
      卡片資料庫
    </h2>
  </div>

  <form hx-post="{%url 'admins:new_card'%}">
    {% csrf_token %}

    <div class="py-4 flex flex-col flex-wrap form-card-bg">
      <h3 class="form-title mb-2">新增卡片</h3>
      <div class="field-group">
        <label for="name" class="field-label required">銀行</label>
        <select
          id="name"
          name="bank"
          type="text"
          class="ui-input"
          placeholder="輸入銀行"
          required
        >
          <option value="" selected disabled>請選擇發卡機構</option>
          {%for bank in banks%}
          <option value="{{bank.id}}">{{bank.name}}</option>
          {% endfor %}
        <select/>
      </div>

      <div class="field-group">
        <label for="card" class="field-label required">信用卡</label>
        <input
        id="card"
        name="card"
        type="text"
        class="ui-input"
        placeholder="輸入信用卡名"
        required
        />
      </div>

      <div class="field-group">
        <label for="network" class="field-label required">發卡機構</label>
        <select id="network"
          class="ui-select"
          name="network"
          required>
          <option value="" selected disabled>請選擇發卡機構</option>
          {%for card_network in card_networks%}
          <option value="{{card_network}}" >{{card_network}}</option>
          {%endfor%}
        <select/>
      </div>

      <div class="field-group">
        <label for="card_type" class="field-label required">卡片等級</label>
        <select id="card_type"
        class="ui-select"
        name="card_type"
        required>
        <option value="" selected disabled>請選擇卡片等級</option>
        {%for card_type in card_types%}
        <option value="{{card_type}}" >{{card_type}}</option>
        {%endfor%}
        <select/>
      </div>

      <div class="field-group">
        <label for="foreign" class="field-label">國外交易手續費（%）</label>
        <input id="foreign" name="foreign" type="number" step="0.1" class="ui-input" />
      </div>

      <div id="is_active" class="field-group flex flex-row items-center">
        <label for="is_active" class="field-label">發行中？</label>
        <input id="is_active" name="is_active" class="checkbox mb-2" type="checkbox">
      </div>

      <div>
        <button type="reset" class="ui-btn ui-btn-secondary cursor-pointer">
          清除
        </button>
        <button type="submit" class="ui-btn ui-btn-primary cursor-pointer">
          新增卡片
        </button>
      </div>
    </div>

  </form>

  <div class="my-4 sm:mb-6">
    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-black">
      所有卡片
    </h2>
  </div>
</section>

{%endblock%}
