{% extends 'admins/default.html' %}

{% block content %}
{% csrf_token %}
<section
  class="relative mx-4 sm:mx-6 lg:mx-10 mb-4 sm:mb-6 lg:mb-8 mt-24"
  x-bind:class="{ 'banner-hidden': !$store.banner.visible }"
  x-data="imageUpload"
>
  <div class="my-4 sm:mb-6">
    <h2 id="image_upload_title" class="text-2xl sm:text-2xl lg:text-2xl font-bold text-black">
      信用卡圖片管理
    </h2>
  </div>

  <div class="overflow-x-auto">
    <table class="table table-zebra w-full">
      <thead>
        <tr>
          <th class="w-12">
            <input 
              type="checkbox" 
              class="checkbox checkbox-sm" 
              @change="toggleSelectAll($event)"
              :checked="isAllSelected()"
            />
          </th>
          <th class="w-32">ID</th>
          <th class="w-48">信用卡名稱</th>
          <th class="w-32">銀行</th>
          <th class="w-64">圖片操作</th>
          <th class="w-32">狀態</th>
          <th class="w-48">最後異動時間</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="card in cards" :key="card.id">
          <tr class="hover:bg-gray-50">
            <!-- 勾選框 -->
            <td>
              <input 
                type="checkbox" 
                class="checkbox checkbox-sm" 
                :checked="selectedCards.includes(card.id)"
                @change="toggleSelectCard(card.id)"
              />
            </td>
            
            <!-- ID -->
            <td x-text="card.id"></td>
            
            <!-- 信用卡名稱 -->
            <td x-text="card.name"></td>
            
            <!-- 銀行 -->
            <td x-text="card.bank"></td>
            
            <!-- 圖片操作區域 -->
            <td>
              <div class="flex flex-col gap-2">
                <!-- 檔案選擇區域 - 水平排列 -->
                <div class="flex items-center gap-3">
                  <!-- 選擇圖片按鈕 -->
                  <div>
                    <input 
                      type="file" 
                      accept="image/*"
                      class="hidden"
                      :id="'fileInput_' + card.id"
                      @change="handleFileSelect($event, card.id)"
                    />
                    <button 
                      @click="document.getElementById('fileInput_' + card.id).click()"
                      class="ui-btn ui-btn-info ui-btn-sm"
                    >
                      選擇圖片
                    </button>
                  </div>
                  
                  <!-- 檔案預覽和路徑 - 在按鈕右側 -->
                  <div x-show="selectedFiles[card.id]" class="text-xs text-gray-600 flex-1">
                    <div class="flex items-center gap-2">
                      <img 
                        x-show="selectedFiles[card.id] && selectedFiles[card.id].preview"
                        :src="selectedFiles[card.id] && selectedFiles[card.id].preview" 
                        class="w-8 h-6 object-cover rounded"
                        :alt="selectedFiles[card.id] && selectedFiles[card.id].name"
                      />
                      <span x-text="selectedFiles[card.id] && selectedFiles[card.id].name" class="truncate"></span>
                    </div>
                  </div>
                </div>
                
                <!-- 操作按鈕 -->
                <div class="flex gap-2">
                  <button 
                    @click="uploadImage(card.id)"
                    :disabled="!selectedFiles[card.id]"
                    class="ui-btn ui-btn-success ui-btn-sm"
                    :class="{ 'opacity-50 cursor-not-allowed': !selectedFiles[card.id] }"
                  >
                    新增
                  </button>
                  <button 
                    @click="deleteImage(card.id)"
                    :disabled="!card.image"
                    class="ui-btn ui-btn-error ui-btn-sm"
                    :class="{ 'opacity-50 cursor-not-allowed': !card.image }"
                  >
                    刪除
                  </button>
                </div>
              </div>
            </td>
            
            <!-- 狀態 -->
            <td>
              <div class="flex items-center gap-2">
                <!-- 已上傳圖片預覽 -->
                <img 
                  x-show="card.image"
                  :src="card.image" 
                  alt="已上傳圖片"
                  class="w-12 h-8 object-cover rounded border"
                  @error="card.image = null"
                />
                <div 
                  class="w-3 h-3 rounded-full"
                  :class="card.image ? 'bg-green-500' : 'bg-gray-300'"
                ></div>
                <span x-text="card.image ? '已上傳' : '未上傳'" class="text-sm"></span>
              </div>
            </td>
            
            <!-- 最後異動時間 -->
            <td x-text="card.last_modified || '無'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- 固定批次操作按鈕 - 確保在 footer 上方 -->
  <div class="batch-actions-container">
    <button
      @click="batchUpload()"
      :disabled="!hasSelectedItems()"
      class="batch-btn"
      :class="hasSelectedItems() ? 'batch-btn-success' : ''"
    >
      批次新增
    </button>
    <button
      @click="batchDelete()"
      :disabled="!hasSelectedItems()"
      class="batch-btn"
      :class="hasSelectedItems() ? 'batch-btn-error' : ''"
    >
      批次刪除
    </button>
  </div>

  <!-- 載入指示器 -->
  <div x-show="isLoading" class="fixed inset-0 bg-black/50 flex items-center justify-center z-60">
    <div class="bg-white p-6 rounded-lg flex items-center gap-4">
      <span class="loading loading-spinner loading-md"></span>
      <span x-text="loadingMessage"></span>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div 
    id="toast-container" 
    class="fixed top-4 right-4 z-50 space-y-2"
    x-data="{ 
      toasts: [],
      addToast(detail) {
        this.toasts.push(detail);
      },
      removeToast(id) {
        this.toasts = this.toasts.filter(t => t.id !== id);
      }
    }"
    @show-toast.window="addToast($event.detail)"
    @hide-toast.window="removeToast($event.detail.id)"
  >
    <template x-for="toast in toasts" :key="toast.id">
      <div 
        :class="[
          'tw-toast min-w-80 max-w-96',
          toast.type === 'success' ? 'tw-success' : 
          toast.type === 'error' ? 'tw-error' : 
          toast.type === 'warning' ? 'tw-warn' : 'tw-info'
        ]"
        x-show="toast.visible"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform translate-x-full"
        x-transition:enter-end="opacity-100 transform translate-x-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform translate-x-0"
        x-transition:leave-end="opacity-0 transform translate-x-full"
      >
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path 
              x-show="toast.type === 'success'"
              fill-rule="evenodd" 
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" 
              clip-rule="evenodd"
            />
            <path 
              x-show="toast.type === 'error'"
              fill-rule="evenodd" 
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" 
              clip-rule="evenodd"
            />
            <path 
              x-show="toast.type !== 'success' && toast.type !== 'error'"
              fill-rule="evenodd" 
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" 
              clip-rule="evenodd"
            />
          </svg>
          <span class="flex-1" x-text="toast.message"></span>
          <button 
            @click="removeToast(toast.id)" 
            class="text-gray-400 hover:text-gray-600 transition-colors"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>
    </template>
  </div>
</section>
{% endblock %}
