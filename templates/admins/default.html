{% load static%}
<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    {%load static%}
    <link rel="stylesheet" href="{% static 'styles/style.css' %}?v={{ STATIC_VERSION }}" />
    <script type="module" src="{% static 'scripts/app.js' %}?v={{ STATIC_VERSION }}"></script>
  </head>
  <body x-data="header()" @scroll.window="handleScroll()" @resize.window="closeMobileMenu()">
    {% include 'admins/admin_header.html' %}

    <main>
      {% include 'layouts/messages.html' %} {% block content %} {% endblock %}
    </main>

    {% include 'layouts/footer.html' %}
  </body>
</html>
