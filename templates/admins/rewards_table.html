<!-- 這是表格內容，會被HTMX動態更新 -->
<div class="bg-white shadow rounded-lg overflow-hidden">
    {% if pending_rewards %}
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                {% if current_status == 'PENDING' %}
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <input type="checkbox" x-model="selectAll" @change="toggleAll()">
                </th>
                {% endif %}
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">信用卡</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分類</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">範圍</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">回饋率</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">回饋類型</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">信心度</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">狀態</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">建立時間</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for reward in pending_rewards %}
                {% include "admins/reward_row.html" %}
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="text-center py-12">
        <p class="text-gray-500">沒有找到任何資料</p>
    </div>
    {% endif %}
</div>
