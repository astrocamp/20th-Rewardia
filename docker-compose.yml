version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewardia-postgres
    environment:
      POSTGRES_DB: rewardia_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rewardia-network

  redis:
    image: redis:7-alpine
    container_name: rewardia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rewardia-network

  rewardia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rewardia-app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - AUTOSTART_WEB=true
      - AUTOSTART_CRAWLER=true
      - CRAWLER_SCHEDULE=${CRAWLER_SCHEDULE}
      - HOME_SELENIUM_URL=${HOME_SELENIUM_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./public:/app/public
      - app_logs:/var/log/supervisor
    networks:
      - rewardia-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_logs:

networks:
  rewardia-network:
    driver: bridge
