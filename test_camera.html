<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攝影機測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">攝影機模態框測試</h1>
        
        <!-- 測試按鈕 -->
        <button @click="openCamera()" 
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            開啟攝影機
        </button>
        
        <!-- 狀態顯示 -->
        <div class="mt-4 p-4 bg-gray-200 rounded">
            <p>showCameraModal: <span x-text="showCameraModal"></span></p>
            <p>isCameraOpen: <span x-text="isCameraOpen"></span></p>
            <p>errorMessage: <span x-text="errorMessage"></span></p>
        </div>
        
        <!-- 攝影機模態框 -->
        <div x-show="showCameraModal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-50 overflow-y-auto"
             @keydown.escape="closeCamera()">
          
          <!-- 背景遮罩 -->
          <div class="fixed inset-0 bg-black/75 transition-opacity"></div>
          
          <!-- 模態框內容 -->
          <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
              
              <!-- 標題列 -->
              <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">信用卡卡號識別</h3>
                <button @click="closeCamera()" 
                        class="text-gray-400 hover:text-gray-600 transition-colors">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
              
              <!-- 攝影機區域 -->
              <div class="p-6">
                <div class="relative bg-gray-900 rounded-lg overflow-hidden">
                  
                  <!-- 攝影機預覽 -->
                  <div class="relative aspect-video bg-black">
                    <video x-ref="video" 
                           class="w-full h-full object-cover"
                           autoplay 
                           muted 
                           playsinline>
                    </video>
                    
                    <!-- 取景框遮罩 -->
                    <div class="absolute inset-0 pointer-events-none">
                      <!-- 上半部分遮罩 -->
                      <div class="absolute top-0 left-0 right-0 bg-black/50"
                           :style="`height: ${(100 - cardFrameHeight) / 2}%`"></div>
                      
                      <!-- 下半部分遮罩 -->
                      <div class="absolute bottom-0 left-0 right-0 bg-black/50"
                           :style="`height: ${(100 - cardFrameHeight) / 2}%`"></div>
                      
                      <!-- 左側遮罩 -->
                      <div class="absolute left-0 top-1/2 w-1/2 transform -translate-y-1/2 bg-black/50"
                           :style="`width: ${(100 - cardFrameWidth) / 2}%; height: ${cardFrameHeight}%`"></div>
                      
                      <!-- 右側遮罩 -->
                      <div class="absolute right-0 top-1/2 w-1/2 transform -translate-y-1/2 bg-black/50"
                           :style="`width: ${(100 - cardFrameWidth) / 2}%; height: ${cardFrameHeight}%`"></div>
                      
                      <!-- 取景框邊框 -->
                      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 border-2 border-white border-dashed"
                           :style="`width: ${cardFrameWidth}%; height: ${cardFrameHeight}%; aspect-ratio: 1.586;`"></div>
                      
                      <!-- 對齊指示器 -->
                      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-center">
                        <div class="text-sm mb-2">請將信用卡對準此框</div>
                        <div class="text-xs opacity-75">確保卡號清晰可見</div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <!-- 控制按鈕 -->
                <div class="mt-6 flex items-center justify-center space-x-4">
                  <button @click="closeCamera()"
                          class="inline-flex items-center px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors">
                    取消
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
    </div>
    
    <script>
        function cameraComponent() {
            return {
                // 攝影機相關狀態
                isCameraOpen: false,
                stream: null,
                videoElement: null,
                
                // UI 狀態
                showCameraModal: false,
                errorMessage: '',
                
                // 取景框尺寸（百分比）
                cardFrameWidth: 80,
                cardFrameHeight: 80 / 1.586, // 根據 1.586 比例計算
                
                // 初始化
                init() {
                    this.videoElement = this.$refs.video;
                },
                
                // 開啟攝影機
                async openCamera() {
                    try {
                        this.errorMessage = '';
                        
                        // 檢查瀏覽器支援
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            this.errorMessage = '您的瀏覽器不支援攝影機功能';
                            return;
                        }
                        
                        // 請求攝影機權限
                        this.stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                width: { ideal: 1280 },
                                height: { ideal: 720 },
                                facingMode: 'environment' // 使用後置攝影機
                            }
                        });
                        
                        // 設定影片來源
                        this.videoElement.srcObject = this.stream;
                        
                        // 等待影片載入
                        await new Promise((resolve) => {
                            this.videoElement.onloadedmetadata = () => {
                                this.videoElement.play();
                                resolve();
                            };
                        });
                        
                        this.isCameraOpen = true;
                        this.showCameraModal = true;
                        console.log('攝影機開啟成功，showCameraModal:', this.showCameraModal);
                        
                    } catch (error) {
                        console.error('攝影機開啟失敗:', error);
                        
                        if (error.name === 'NotAllowedError') {
                            this.errorMessage = '請允許使用攝影機權限';
                        } else if (error.name === 'NotFoundError') {
                            this.errorMessage = '找不到攝影機設備';
                        } else {
                            this.errorMessage = '攝影機開啟失敗: ' + error.message;
                        }
                        
                        this.showCameraModal = false;
                        this.isCameraOpen = false;
                    }
                },
                
                // 關閉攝影機
                closeCamera() {
                    console.log('關閉攝影機');
                    
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                        this.stream = null;
                    }
                    
                    if (this.videoElement) {
                        this.videoElement.srcObject = null;
                    }
                    
                    this.showCameraModal = false;
                    this.isCameraOpen = false;
                    this.errorMessage = '';
                }
            };
        }
        
        // 註冊組件
        Alpine.data('cameraComponent', cameraComponent);
    </script>
</body>
</html>
