{% extends 'layouts/default.html' %}

{% block title %}註冊 - Rewardia{% endblock %}

{% block content %}
<!-- 註冊頁面容器 -->
<div class="min-h-screen bg-gray-50 pt-12 pb-24">
  <div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8">
    <!-- 註冊卡片 -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
      <!-- 頁面標題 -->
      <div class="px-10 pt-10 pb-8">
        <h1 class="text-4xl font-bold text-black font-['Kulim_Park'] leading-tight">
          註冊
        </h1>
      </div>

      <!-- 註冊表單 -->
      <div class="px-10 pb-10">
        <!-- 主要註冊表單 -->
        <form class="space-y-5" x-data="registerForm" @submit.prevent="submitForm()">
          <!-- 帳號欄位 -->
          <div class="register-field-container">
            <label for="username" class="register-label">
              帳號
            </label>
            <div class="register-relative-container">
              <input 
                type="text" 
                id="username" 
                name="username"
                placeholder="請輸入您的帳號"
                class="register-input"
                required
              >
            </div>
          </div>

          <!-- 電子郵件欄位 -->
          <div class="register-field-container">
            <label for="email" class="register-label">
              電子郵件
            </label>
            <div class="register-relative-container">
              <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="請輸入您的電子郵件"
                class="register-input"
                required
              >
            </div>
          </div>

          <!-- 密碼欄位 -->
          <div class="register-field-container">
            <label for="password" class="register-label">
              密碼
            </label>
            <div class="register-relative-container">
              <input 
                :type="passwordVisible ? 'text' : 'password'"
                id="password" 
                name="password1"
                placeholder="請輸入您的密碼"
                class="register-input pr-12"
                required
              >
              <!-- 眼睛圖標 -->
              <button 
                type="button" 
                class="password-toggle-btn"
                @click="togglePassword('password')"
              >
                {% include 'components/icons/icon.html' with name="eye" class="w-6 h-6" %}
              </button>
            </div>
          </div>

          <!-- 確認密碼欄位 -->
          <div class="register-field-container">
            <label for="confirm-password" class="register-label">
              確認密碼
            </label>
            <div class="register-relative-container">
              <input 
                :type="confirmPasswordVisible ? 'text' : 'password'"
                id="confirm-password" 
                name="password2"
                placeholder="請再次輸入您的密碼"
                class="register-input pr-12"
                required
              >
              <!-- 眼睛圖標 -->
              <button 
                type="button" 
                class="password-toggle-btn"
                @click="togglePassword('confirm')"
              >
                {% include 'components/icons/icon.html' with name="eye" class="w-6 h-6" %}
              </button>
            </div>
          </div>

          <!-- 服務條款勾選框 -->
          <div class="flex items-start space-x-3 pt-2">
            <input 
              type="checkbox" 
              id="terms" 
              name="terms"
              class="register-checkbox"
              required
            >
            <label for="terms" class="text-lg text-gray-700 font-normal leading-relaxed">
              我同意網站
              <a href="#" id="service-terms" class="register-link">
                服務條款
              </a>
              及
              <a href="#" id="privacy-policy" class="register-link">
                隱私權政策
              </a>
            </label>
          </div>

          <!-- 主要註冊按鈕 -->
          <button 
            type="submit" 
            class="register-btn-primary"
          >
            建立帳號
          </button>
        </form>

        <!-- 分隔線 -->
        <div class="register-divider-container">
          <div class="register-divider-line">
            <div class="register-divider"></div>
          </div>
          <div class="register-divider-text-container">
            <span class="register-divider-text">或</span>
          </div>
        </div>

        <!-- Google 註冊按鈕 -->
        <a 
          href="#" 
          id="google-register"
          class="register-btn-google"
          role="button"
          aria-label="使用 Google 帳號註冊"
        >
          {% include 'components/icons/icon.html' with name="google" class="w-6 h-6" %}
          <span>使用 Google 帳號註冊</span>
        </a>

        <!-- 登入連結 -->
        <div class="register-login-container">
          <p class="register-login-text">
            已經有帳號？
            <a href="{% url 'pages:login' %}" id="login-link" class="register-link">
              登入
            </a>
            去
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
