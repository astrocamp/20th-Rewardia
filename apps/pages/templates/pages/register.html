{% extends 'layouts/default.html' %}

{% block title %}註冊 - Rewardia{% endblock %}

{% block content %}
<!-- 註冊頁面容器 -->
<div class="min-h-screen bg-gray-50 pt-12 pb-24">
  <div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8">
    <!-- 註冊卡片 -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
      <!-- 頁面標題 -->
      <div class="px-10 pt-10 pb-8">
        <h1 class="text-4xl font-bold text-black font-['Kulim_Park'] leading-tight">
          註冊
        </h1>
      </div>

      <!-- 註冊表單 -->
      <div class="px-10 pb-10">
        <!-- 主要註冊表單 -->
        <form class="space-y-5" x-data="registerForm" @submit.prevent="submitForm()">
          <!-- 帳號欄位 -->
          <div class="register-field-container">
            <label for="username" class="register-label">
              帳號
            </label>
            <div class="register-relative-container">
              <input 
                type="text" 
                id="username" 
                name="username"
                placeholder="請輸入您的帳號"
                class="register-input"
                required
              >
            </div>
          </div>

          <!-- 電子郵件欄位 -->
          <div class="register-field-container">
            <label for="email" class="register-label">
              電子郵件
            </label>
            <div class="register-relative-container">
              <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="請輸入您的電子郵件"
                class="register-input"
                required
              >
            </div>
          </div>

          <!-- 密碼欄位 -->
          <div class="register-field-container">
            <label for="password" class="register-label">
              密碼
            </label>
            <div class="register-relative-container">
              <input 
                :type="passwordVisible ? 'text' : 'password'"
                id="password" 
                name="password1"
                placeholder="請輸入您的密碼"
                class="register-input pr-12"
                required
              >
              <!-- 眼睛圖標 -->
              <button 
                type="button" 
                class="password-toggle-btn"
                @click="togglePassword('password')"
              >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path x-show="!passwordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path x-show="!passwordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  <path x-show="passwordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 確認密碼欄位 -->
          <div class="register-field-container">
            <label for="confirm-password" class="register-label">
              確認密碼
            </label>
            <div class="register-relative-container">
              <input 
                :type="confirmPasswordVisible ? 'text' : 'password'"
                id="confirm-password" 
                name="password2"
                placeholder="請再次輸入您的密碼"
                class="register-input pr-12"
                required
              >
              <!-- 眼睛圖標 -->
              <button 
                type="button" 
                class="password-toggle-btn"
                @click="togglePassword('confirm')"
              >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path x-show="!confirmPasswordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path x-show="!confirmPasswordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  <path x-show="confirmPasswordVisible" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 服務條款勾選框 -->
          <div class="flex items-start space-x-3 pt-2">
            <input 
              type="checkbox" 
              id="terms" 
              name="terms"
              class="register-checkbox"
              required
            >
            <label for="terms" class="text-lg text-gray-700 font-normal leading-relaxed">
              我同意網站
              <a href="#" id="service-terms" class="register-link">
                服務條款
              </a>
              及
              <a href="#" id="privacy-policy" class="register-link">
                隱私權政策
              </a>
            </label>
          </div>

          <!-- 主要註冊按鈕 -->
          <button 
            type="submit" 
            class="register-btn-primary"
          >
            建立帳號
          </button>
        </form>

        <!-- 分隔線 -->
        <div class="register-divider-container">
          <div class="register-divider-line">
            <div class="register-divider"></div>
          </div>
          <div class="register-divider-text-container">
            <span class="register-divider-text">或</span>
          </div>
        </div>

        <!-- Google 註冊按鈕 -->
        <a 
          href="#" 
          id="google-register"
          class="register-btn-google"
          role="button"
          aria-label="使用 Google 帳號註冊"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>使用 Google 帳號註冊</span>
        </a>

        <!-- 登入連結 -->
        <div class="register-login-container">
          <p class="register-login-text">
            已經有帳號？
            <a href="#" id="login-link" class="register-link">
              登入
            </a>
            去
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
